[project]
name = "PyHeart"
version = "0.1.0"
description = "PyHeart"
authors = [
    {name = "Gowther Heart",email = "heartgowther@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "redis (>=5.2.1,<6.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "loguru (>=0.7.3,<0.8.0) ; python_version >= '3.13' and python_version < '4.0'",
    "httpx (==0.27.0)",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "mypy>=1.16.1",
    "pyrefly>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]


[tool.isort]
profile = "black"

[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
exclude = [
		"**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs",
]
reportMissingImports = true
reportTypeshedErrors = false
reportMissingTypeStubs = false
strictParameterNoneValue = false
reportOptionalMemberAccess = "none"
reportUndefinedVariable = true
typeCheckingMode = "basic"
# typeCheckingMode = "strict"


#### pyrefly ####
[tool.pyrefly]
# ignore-missing-imports = ["*"]
project-includes = ["."]
search-path = ["."]

[tool.pyrefly.errors]
bad-override=false

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "__pycache__",
]

[tool.ruff.lint]
select = [
	"E",      # pycodestyle errors
	"W",      # pycodestyle warnings
	"F",      # pyflakes
	"I",      # isort
	"N",      # pep8-naming
	"D",      # pydocstyle
	"UP",     # pyupgrade
	"B",      # flake8-bugbear
	"C4",     # flake8-comprehensions
	"SIM",    # flake8-simplify
	"TID",    # flake8-tidy-imports
	"Q",      # flake8-quotes
	"FBT",    # flake8-boolean-trap
	"RUF",    # Ruff-specific rules
	"ASYNC",  # flake8-async
	"FA",     # flake8-future-annotations
	"ISC",    # flake8-implicit-str-concat
	"ICN",    # flake8-import-conventions
	"G",      # flake8-logging-format
	"PIE",    # flake8-pie
	"PT",     # flake8-pytest-style
	"RSE",    # flake8-raise
	"RET",    # flake8-return
	"SLOT",   # flake8-slots
	"TCH",    # flake8-type-checking
	"PTH",    # flake8-use-pathlib
	"PERF",   # Perflint
	"FURB",   # refurb
	"LOG",    # flake8-logging
]
ignore = [
	"D100",   # Missing docstring in public module
	"D101",   # Missing docstring in public class
	"D102",   # Missing docstring in public method
	"D103",   # Missing docstring in public function
	"D104",   # Missing docstring in public package
	"D105",   # Missing docstring in magic method
	"D106",   # Missing docstring in public nested class
	"D107",   # Missing docstring in __init__
	"D203",   # 1 blank line required before class docstring
	"D213",   # Multi-line docstring summary should start at the second line
	"B008",   # Do not perform function calls in argument defaults
	"RET504", # Unnecessary assignment before return
	"RUF012",
	"F403",
	"E501",
	"D205",
	"N802",
	"B904",
	"N801",
	"E402",
	"PT020",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
	"S101",   # Use of assert detected
	"D",      # Ignore all docstring warnings in tests
	"FBT",    # Allow boolean traps in tests
]
"src/cmd/**/*.py" = [
	"T201",   # print found
]
"src/controllers/**/_examples/*.py" = [
	"D",      # Ignore docstrings in examples
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
